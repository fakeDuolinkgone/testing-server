<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Word Chain</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="wordChain.css">

    <link rel="icon" type="image/png" href="../../pics/mascotPics/iconWebsite_main.png">
</head>






<body spellcheck="false">


    <!-- ================= BẢNG KẾT QUẢ ================= -->
    <div class="result-screen" id="resultScreen" role="dialog" aria-modal="true" aria-labelledby="resultTitle">
        <div class="result-box">
            <h1 id="resultTitle">
                RESULT
            </h1>
            <p id="resultReason"></p>

            <!-- Vòng tròn % (độ chính xác), giống bảng kết quả của chế độ PLAY -->
            <div class="rs-ring">
                <svg viewBox="0 0 200 200" aria-hidden="true">
                    <circle class="trk" cx="100" cy="100" r="82" pathLength="100"></circle>
                    <circle id="resultRingFill" class="fil" cx="100" cy="100" r="82" pathLength="100"></circle>
                </svg>
                <div class="rs-ring-text">
                    <div id="resultPercent" class="rs-percent">0%</div>
                    <div id="resultTotal" class="rs-total"></div>
                </div>
            </div>

            <p id="resultRank" class="rs-rank"></p>
            <p id="resultMessage" class="rs-message"></p>

            <ul id="resultScore"></ul>

            <div class="rs-actions">
                <button type="button" onclick="restartGame()" class="restartGame-btn">
                    Chơi lại
                </button>

                <button type="button" class="restartGame-btn" onclick="location.href='../../game.html'">
                    Quay về
                </button>
            </div>
        </div>

        <div class="result-meaning">
            <h2>Lịch Sử Từ Vựng</h2>
            <p id="resultWord"></p>
        </div>

    </div>














    <!-- Background Bubble -->
    <div class="bubble-container" aria-hidden="true">
        <span class="bubble"></span>
        <span class="bubble"></span>
        <span class="bubble"></span>
        <span class="bubble"></span>
        <span class="bubble"></span>
        <span class="bubble"></span>
        <span class="bubble"></span>
        <span class="bubble"></span>
        <span class="bubble"></span>
        <span class="bubble"></span>
        <span class="bubble"></span>
        <span class="bubble"></span>
        <span class="bubble"></span>
        <span class="bubble"></span>
        <span class="bubble"></span>
        <span class="bubble"></span>
        <span class="bubble"></span>
        <span class="bubble"></span>
        <span class="bubble"></span>
        <span class="bubble"></span>
    </div>






    <div class="game-wrapper">
        <!-- ================= SETTINGS ================= -->
        <div class="settings-overlay" id="settingsOverlay">

            <div class="settings-box">

                <h2>CÀI ĐẶT</h2>

                <button type="button" class="settings-btn" id="continueBtn">
                    ▶ Tiếp tục
                </button>

                <button type="button" class="settings-btn" id="restartSettingsBtn">
                    🔄 Chơi lại
                </button>

                <button type="button" class="settings-btn" id="exitSettingsBtn">
                    🚪 Thoát
                </button>

            </div>

        </div>



        <!--==================THANH STREAK===================-->
        <div class="streak-box" id="streakBox">
            <div class="streak-fill" id="streakFill"></div>
            <div class="streak-text" id="streakText">
                STREAK x0
            </div>
        </div>





        <!--=====================GAME===================-->
        <div class="wc-container">




            <!-- Top Bar -->
            <div class="wc-top">
                <div class="player-life">
                    <span class="life"><img src="../../pics/heart icon.png" alt="Mạng" width="40" height="40"></span>
                    <span class="life"><img src="../../pics/heart icon.png" alt="Mạng" width="40" height="40"></span>
                </div>
                <div class="timer-box">
                    <div class="timer" id="timer">
                        30s
                    </div>
                    <div class="mistake" id="mistake">
                        ❌ 0/5
                    </div>
                </div>
                <div class="top-icon">
                    <button type="button" id="chatBtn" title="Trò chuyện" aria-label="Trò chuyện"><img src="../../pics/chatting icon.png" alt="" width="40" height="40"></button>
                    <button type="button" id="settingBtn" title="Cài đặt" aria-label="Cài đặt"><img src="../../pics/setting icon.png" alt="" width="40" height="40"></button>
                </div>
            </div>










            <!-- Chat Area -->
            <div class="chat-area" id="chatArea">
                <!-- Player -->
                <div class="message left"></div>
                <!-- AI -->
                <div class="message right"></div>
            </div>





            <!-- Input -->
            <div class="input-area">
                <input id="wordInput" type="text" placeholder="Input here" autocomplete="off" autocapitalize="off" autofocus>
                <button type="button" class="submit-button">Submit</button>
            </div>
        </div>
    </div>




















    <audio id="sound-correct" src="../../audio/correct.mp3"></audio>
    <audio id="sound-wrong" src="../../audio/wrong.mp3"></audio>
    <audio id="sound-finish" src="../../audio/finish.mp3"></audio>


    <script src="../../JS/common/audio.js"></script>

    <script src="../../data/wordChainData.js"></script>
    <script src="wordChain.js"></script>
</body>

</html>
