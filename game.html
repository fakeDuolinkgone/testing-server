<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8">
  <title>GAME - normaFix</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="CSS/englishCSS.css">
  <link rel="stylesheet" href="CSS/resultScreen.css">
  <script src="JS/common/user.js"></script>

  <link rel="icon" type="image/png" href="pics/mascotPics/iconWebsite_main.png">
</head>




<body spellcheck="false">





  <div class="container">
    <aside class="sidebar">
      <div class="menu-list">
        <div class="menu-item-back" onclick="location.href='index.html'">
          <span class="letter"">B</span>
          <span class="text">Back</span>
        </div>
        <div class="menu-item-room" onclick="location.href='room.html'">
          <span class="letter">R</span>
          <span class="text">Room</span>
        </div>
        <div class="menu-item-document" onclick="location.href='document.html'">
          <span class="letter">D</span>
          <span class="text">Document</span>
        </div>
      </div>
    </aside>






    <div class="game-grid">
      <div class="game-card learn" onclick="startLearn()">
        <div class="play-icon">▶</div>
        <h2>LEARN</h2>
      </div>
      <div class="wordhunt game-card" onclick="location.href='gameMode/wordHunt/wordHunt.html'">
        <h2>WORDHUNT</h2>
      </div>
      <div class="hangman game-card" onclick="location.href='gameMode/hangman/hangman.html'">
        <h2>HANGMAN</h2>
      </div>
      <div class="wordpuzzle game-card" onclick="location.href='gameMode/wordPuzzle/wordPuzzle.html?single=1'">
        <h2>WORDPUZZLE</h2>
      </div>
      <div class="wordchain game-card" onclick="location.href='gameMode/wordChain/wordChain.html'">
        <h2>WORDCHAIN</h2>
      </div>
    </div>





    <!--========================CÁI MÀN HÌNH CỦA GAME.HTML NÈ. CHÚ Ý TAO ĐI=======================-->
    <div id="learnScreen" class="learn-screen">
      <div class="learn-progress">
        <div id="progressMessage" class="progress-message">
        </div>
        <div class="progress-bar">
          <div id="progressFill" class="progress-fill"></div>
        </div>
      </div>






      <!--LOADING SCEEN-->
      <div id="loadingScreen" class="loading-screen">
        <div class="loading-box">
          <div class="loading-spinner"></div>
          <h2 id="loadingTitle">Loading...</h2>
        </div>
      </div>




      <!--LEARN BOX HERE-->
      <div class="learn-box">
        <div class="typing-header">
          <div id="questionCount">1 / 10</div>
          <div id="timer">--</div>
        </div>




        <!-- CHẾ ĐỘ SPEED TYPING -->
        <div class="typing-word">
          <span id="typingWord"></span>
          <span id="typingClass" class="typing-class"></span>
        </div>
        <p id="typingMeaning" class="typing-meaning"></p>
        <input id="typingInput" type="text" autocomplete="off" placeholder="Hãy viết lại từ vựng trên">







        <!--CHẾ ĐỘ TRẮC NGHIỆM-->
        <div id="choiceBox" class="choice-box">
          <button class="choice-btn"></button>
          <button class="choice-btn"></button>
          <button class="choice-btn"></button>
          <button class="choice-btn"></button>
        </div>



        <!--CHẾ ĐỘ NỐI CỘT-->
        <div id="matchBox" class="match-box">
          <div id="matchLeft" class="match-column"></div>
          <div id="matchRight" class="match-column"></div>
        </div>




        <!-- CHẾ ĐỘ ĐIỀN VÀO CHỖ TRỐNG -->
        <div id="sentenceBox" class="sentence-box">

          <div id="sentenceExample" class="sentence-example">
            Learning English has many ______.
          </div>

          <div id="sentenceHint" class="sentence-hint">
            (n) : lợi ích
          </div>

          <div class="sentence-choice">

            <button id="sentenceBtn1" class="sentence-btn">
              benefit
            </button>

            <button id="sentenceBtn2" class="sentence-btn">
              advantages
            </button>
          </div>
        </div>




















      </div>
    </div>

    <div id="resultScreen" class="result-screen" style="display:none" role="dialog" aria-labelledby="resultTitle">
      <div class="result-card">

        <h2 id="resultTitle" class="result-title">Kết quả</h2>

        <div class="result-ring">
          <svg viewBox="0 0 200 200" aria-hidden="true">
            <circle class="ring-track" cx="100" cy="100" r="82" pathLength="100"></circle>
            <circle id="resultRingFill" class="ring-fill" cx="100" cy="100" r="82" pathLength="100"></circle>
          </svg>
          <div class="ring-text">
            <div id="resultPercent" class="ring-percent">0%</div>
            <div id="resultTotal" class="ring-total">0 / 0 câu</div>
          </div>
        </div>

        <p id="resultRank" class="result-rank"></p>
        <p id="resultMessage" class="result-message"></p>

        <ul id="resultList" class="result-list"></ul>

        <div class="result-actions">
          <button id="resultRestartBtn" class="result-btn primary">🔄 Chơi lại</button>
          <button id="resultHomeBtn" class="result-btn">🏠 Về trang chủ</button>
        </div>

      </div>
    </div>





  </div>




  <!-- ================= BẢNG KẾT QUẢ (chế độ PLAY / LEARN) =================
     Dán vào game.html, NGAY TRƯỚC dòng <script src="data/englishVocabularys.js"></script>.
     Phải là con trực tiếp của <body>: KHÔNG đặt trong .container hay .game-grid
     (đặt trong .game-grid thì bị ẩn theo khi vào chơi, bảng sẽ không bao giờ hiện).
     style="display:none" là cố ý: JS bật/tắt bằng style trực tiếp nên CSS khác không đè được. -->
  <div id="resultScreen" class="result-screen" style="display:none" role="dialog" aria-modal="true"
    aria-labelledby="resultTitle">
    <div class="result-card">

      <h2 id="resultTitle" class="result-title">Kết quả</h2>

      <div class="result-ring">
        <svg viewBox="0 0 200 200" aria-hidden="true">
          <circle class="ring-track" cx="100" cy="100" r="82" pathLength="100"></circle>
          <circle id="resultRingFill" class="ring-fill" cx="100" cy="100" r="82" pathLength="100"></circle>
        </svg>
        <div class="ring-text">
          <div id="resultPercent" class="ring-percent">0%</div>
          <div id="resultTotal" class="ring-total">0 / 0 câu</div>
        </div>
      </div>

      <p id="resultRank" class="result-rank"></p>
      <p id="resultMessage" class="result-message"></p>

      <ul id="resultList" class="result-list"></ul>

      <div class="result-actions">
        <button id="resultRestartBtn" class="result-btn primary" type="button">🔄 Chơi lại</button>
        <button id="resultHomeBtn" class="result-btn" type="button">🏠 Về trang chủ</button>
      </div>

    </div>
  </div>

  <!-- Thêm vào <head> của game.html:      <link rel="stylesheet" href="CSS/resultScreen.css">
     Thêm vào cuối <body>, SAU dòng game.js:   <script src="JS/games/result.js"></script> -->













  <script src="data/englishVocabularys.js"></script>

  <!--=============QUESTION TYPE===============-->
  <script src="JS/questionType/speedTyping.js"></script>
  <script src="JS/questionType/choice.js"></script>
  <script src="JS/questionType/match.js"></script>
  <script src="JS/questionType/sentenceFill.js"></script>








  <script src="JS/games/game.js"></script>


  <script src="JS/common/audio.js"></script>


  <audio id="sound-correct" src="audio/correct.mp3" preload="auto"></audio>
  <audio id="sound-wrong" src="audio/wrong.mp3" preload="auto"></audio>
  <audio id="sound-finish" src="audio/finish.mp3" preload="auto"></audio>

</body>

</html>
